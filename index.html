<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:          #1C1530;
    --surface:     #261E3D;
    --surface2:    #2E2549;
    --border:      rgba(255,255,255,0.07);
    --border-hi:   rgba(255,255,255,0.13);
    --purple:      #7B52AB;
    --purple-dim:  rgba(123,82,171,0.18);
    --gold:        #C9A84C;
    --gold-dim:    rgba(201,168,76,0.15);
    --green:       #3DAA77;
    --green-dim:   rgba(61,170,119,0.15);
    --red:         #D95F52;
    --red-dim:     rgba(217,95,82,0.15);
    --amber:       #D4924A;
    --amber-dim:   rgba(212,146,74,0.15);
    --blue:        #4A8FD4;
    --blue-dim:    rgba(74,143,212,0.15);
    --muted:       rgba(255,255,255,0.22);
    --muted2:      rgba(255,255,255,0.10);
    --text:        #FFFFFF;
    --text-sub:    rgba(255,255,255,0.55);
    --text-dim:    rgba(255,255,255,0.30);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* HEADER */
  .header {
    padding: 36px 48px 0;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 24px;
  }
  .header-title {
    font-family: 'DM Sans', sans-serif;
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.2px;
  }
  .header-meta { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 500; padding: 4px 11px;
    border-radius: 20px; letter-spacing: 0.3px;
  }
  .pill-live {
    background: var(--gold-dim);
    border: 1px solid rgba(201,168,76,0.3);
    color: var(--gold);
  }
  .pill-live::before {
    content: ''; width: 5px; height: 5px; border-radius: 50%;
    background: var(--gold); animation: blink 2s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.25} }

  .gold-rule {
    height: 1px;
    background: linear-gradient(90deg, var(--gold) 0%, rgba(201,168,76,0.1) 60%, transparent 100%);
    margin: 28px 48px 0;
  }

  /* WEEK NAV */
  .week-nav { display: flex; gap: 6px; padding: 24px 48px 0; flex-wrap: wrap; align-items: center; }
  .week-nav-label { font-size: 11px; color: var(--text-dim); margin-right: 6px; }
  .week-btn {
    font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500;
    padding: 7px 16px; border-radius: 8px; border: 1px solid var(--border);
    background: transparent; color: var(--text-sub); cursor: pointer;
    transition: all 0.18s; line-height: 1;
  }
  .week-btn:hover:not(.locked) { border-color: var(--border-hi); color: var(--text); }
  .week-btn.active { background: var(--purple-dim); border-color: rgba(123,82,171,0.5); color: var(--text); font-weight: 600; }
  .week-btn.locked { opacity: 0.3; cursor: default; }
  .week-range { font-weight: 400; color: var(--text-dim); margin-left: 4px; }

  /* MAIN */
  .main { padding: 32px 48px 56px; display: flex; flex-direction: column; gap: 28px; max-width: 1400px; }

  /* SEC LABEL */
  .sec-label {
    font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 1.2px; color: var(--text-dim); margin-bottom: 14px;
  }

  /* GRIDS */
  .grid-6 { display: grid; grid-template-columns: repeat(6,1fr); gap: 14px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; }
  .grid-2 { display: grid; grid-template-columns: repeat(2,1fr); gap: 14px; }

  /* CARD */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
  .card-title {
    font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 1px; color: var(--text-dim); margin-bottom: 18px;
    display: flex; align-items: baseline; gap: 6px;
  }
  .card-title-note { font-size: 10px; font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--text-dim); opacity: 0.7; }

  /* KPI CARD */
  .kpi-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 22px 20px 18px; position: relative; overflow: hidden;
  }
  .kpi-accent { position: absolute; top: 0; left: 0; right: 0; height: 2px; border-radius: 12px 12px 0 0; }
  .kpi-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); margin-bottom: 10px; }
  .kpi-value { font-family: 'DM Sans', sans-serif; font-size: 38px; font-weight: 700; color: var(--text); line-height: 1; letter-spacing: -2px; }
  .kpi-sub { font-size: 11px; color: var(--text-sub); margin-top: 6px; font-weight: 400; }
  .prog-track { height: 3px; background: var(--surface2); border-radius: 3px; margin-top: 10px; overflow: hidden; }
  .prog-fill { height: 100%; border-radius: 3px; background: var(--gold); transition: width 1.1s cubic-bezier(.4,0,.2,1); }

  /* FUNIL */
  .funnel { display: flex; flex-direction: column; gap: 6px; }
  .funnel-step {
    border-radius: 8px; padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .funnel-lbl { font-size: 12px; font-weight: 500; }
  .funnel-sub { font-size: 10px; margin-top: 2px; opacity: 0.6; }
  .funnel-n { font-family: 'DM Sans', sans-serif; font-size: 24px; font-weight: 700; }
  .fs-1 { background: var(--purple-dim); }  .fs-1 .funnel-n { color: var(--purple); }
  .fs-2 { background: var(--blue-dim); }    .fs-2 .funnel-n { color: var(--blue); }
  .fs-3 { background: var(--green-dim); }   .fs-3 .funnel-n { color: var(--green); }
  .fs-4 { background: var(--gold-dim); }    .fs-4 .funnel-n { color: var(--gold); }

  /* BAR */
  .bar-list { display: flex; flex-direction: column; gap: 11px; }
  .bar-row { display: flex; align-items: center; gap: 10px; }
  .bar-lbl { font-size: 12px; color: var(--text-sub); width: 108px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track { flex: 1; height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; transition: width 1.1s cubic-bezier(.4,0,.2,1); }
  .bar-n { font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; color: var(--text); width: 22px; text-align: right; flex-shrink: 0; }

  /* DONUT */
  .donut-wrap { display: flex; align-items: center; gap: 20px; }
  .donut-legend { flex: 1; display: flex; flex-direction: column; gap: 9px; }
  .leg-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-sub); }
  .leg-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .leg-n { margin-left: auto; font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 13px; color: var(--text); }

  /* STATUS LIST */
  .status-list { display: flex; flex-direction: column; gap: 7px; }
  .status-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 14px; border-radius: 8px; border: 1px solid transparent; }
  .status-left { display: flex; flex-direction: column; gap: 2px; }
  .status-lbl { font-size: 12px; font-weight: 500; }
  .status-note { font-size: 10px; opacity: 0.55; font-weight: 400; }
  .status-n { font-family: 'DM Sans', sans-serif; font-size: 20px; font-weight: 700; flex-shrink: 0; }

  .s-green  { background: var(--green-dim);  border-color: rgba(61,170,119,0.2); }
  .s-green  .status-lbl, .s-green  .status-n { color: var(--green); }
  .s-red    { background: var(--red-dim);    border-color: rgba(217,95,82,0.2); }
  .s-red    .status-lbl, .s-red    .status-n { color: var(--red); }
  .s-amber  { background: var(--amber-dim);  border-color: rgba(212,146,74,0.2); }
  .s-amber  .status-lbl, .s-amber  .status-n { color: var(--amber); }
  .s-blue   { background: var(--blue-dim);   border-color: rgba(74,143,212,0.2); }
  .s-blue   .status-lbl, .s-blue   .status-n { color: var(--blue); }
  .s-purple { background: var(--purple-dim); border-color: rgba(123,82,171,0.2); }
  .s-purple .status-lbl, .s-purple .status-n { color: var(--purple); }
  .s-gray   { background: rgba(255,255,255,0.04); border-color: var(--border); }
  .s-gray   .status-lbl, .s-gray   .status-n { color: var(--text-dim); }

  /* INSIGHTS */
  .insight-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .insight-item {
    display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px;
    border-radius: 8px; background: var(--surface2); border-left: 2px solid transparent;
    font-size: 12.5px; color: var(--text-sub); line-height: 1.55;
  }
  .insight-item.ok    { border-left-color: var(--green); }
  .insight-item.warn  { border-left-color: var(--gold); }
  .insight-item.alert { border-left-color: var(--red); }
  .insight-item.info  { border-left-color: var(--purple); }
  .insight-icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }

  /* EMPTY */
  .empty { text-align: center; padding: 80px 24px; color: var(--text-dim); }
  .empty-icon { font-size: 32px; margin-bottom: 14px; }
  .empty p { font-size: 14px; line-height: 1.7; }

  /* FOOTER */
  .footer { text-align: center; font-size: 11px; color: var(--text-dim); padding: 0 48px 36px; }

  @media (max-width: 960px) {
    .header, .gold-rule, .week-nav, .main, .footer { padding-left: 20px; padding-right: 20px; }
    .grid-6, .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr 1fr; }
    .insight-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 600px) {
    .grid-6, .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; }
  }
</style>
</head>

/* DONUT */
function donut(segs, size=96, sw=14) {
  const r=(size-sw)/2, cx=size/2, cy=size/2, c=2*Math.PI*r;
  const tot=segs.reduce((a,s)=>a+s.n,0);
  let off=0;
  const arcs=segs.map(s=>{
    const d=(s.n/tot)*c;
    const a=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.cor}" stroke-width="${sw}" stroke-dasharray="${d.toFixed(2)} ${(c-d).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"/>`;
    off+=d; return a;
  });
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex-shrink:0">${arcs.join('')}</svg>`;
}

/* BARS */
function bars(items, maxN) {
  return `<div class="bar-list">${items.map(t=>`
    <div class="bar-row">
      <div class="bar-lbl" title="${t.nome}">${t.nome}</div>
      <div class="bar-track"><div class="bar-fill" data-pct="${(t.n/maxN*100).toFixed(1)}" style="width:0%;background:${t.cor}"></div></div>
      <div class="bar-n">${t.n}</div>
    </div>`).join('')}</div>`;
}

/* STATUS CARD */
function statusCard(title, items, note='') {
  return `<div class="card">
    <div class="card-title">${title}${note?`<span class="card-title-note">${note}</span>`:''}</div>
    <div class="status-list">${items.map(r=>`
      <div class="status-row ${r.cls}">
        <div class="status-left">
          <span class="status-lbl">${r.lbl}</span>
          ${r.note?`<span class="status-note">${r.note}</span>`:''}
        </div>
        <span class="status-n">${r.n}</span>
      </div>`).join('')}
    </div>
  </div>`;
}

          <div class="funnel">
            <div class="funnel-step fs-1">
              <div><div class="funnel-lbl">Total de casos</div><div class="funnel-sub">Interações nas redes sociais</div></div>
              <div class="funnel-n">${d.total}</div>
            </div>
            <div class="funnel-step fs-2">
              <div><div class="funnel-lbl">Entraram em contato</div><div class="funnel-sub">Chegaram ao WhatsApp</div></div>
              <div class="funnel-n">${d.contatoSim}</div>
            </div>
            <div class="funnel-step fs-3">
              <div><div class="funnel-lbl">Foram atendidos</div><div class="funnel-sub">Atendimento realizado</div></div>
              <div class="funnel-n">${d.atendidoSim}</div>
            </div>
            <div class="funnel-step fs-4">
              <div><div class="funnel-lbl">Resolvidos</div><div class="funnel-sub">Caso encerrado com resolução</div></div>
              <div class="funnel-n">${d.resolvido}</div>
            </div>
          </div>
        </div>

      </div>
    </section>

    <!-- ATENDIMENTO & RESOLUÇÃO -->
    <section>
      <div class="sec-label">Atendimento & Resolução</div>
      <div class="grid-3">
        ${statusCard('Foi atendido?', d.atendidos)}
        ${statusCard('Houve resolução?', d.resolucao)}
        <div class="card">
          <div class="card-title">Resumo de Resolução</div>
          <div class="status-list">
            <div class="status-row s-green">
              <div class="status-left"><span class="status-lbl">Taxa de atendimento</span><span class="status-note">dos que contataram</span></div>
              <span class="status-n">${ta}%</span>
            </div>
            <div class="status-row s-amber">
              <div class="status-left"><span class="status-lbl">Taxa de resolução</span><span class="status-note">dos atendidos</span></div>
              <span class="status-n">${tr}%</span>
            </div>
            <div class="status-row s-red">
              <div class="status-left"><span class="status-lbl">Não atendidos</span><span class="status-note">motivo variado</span></div>
              <span class="status-n">${d.atendidoNao}</span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- INSIGHTS -->
    <section>
      <div class="sec-label">Pontos de Atenção & Destaques</div>
      <div class="card">
        <div class="insight-grid">
          ${d.insights.map(i=>`
            <div class="insight-item ${i.tipo}">
              <span class="insight-icon">${i.icon}</span>
              <span>${i.texto}</span>
            </div>`).join('')}
        </div>
      </div>
    </section>
  `;

  ft.innerHTML = `${wk.label} (${wk.range}) · Melhoria Contínua BR`;

  requestAnimationFrame(()=>{
    setTimeout(()=>{
      document.querySelectorAll('.prog-fill').forEach(el=>{
        el.style.width = el.dataset.pct+'%';
      });
      document.querySelectorAll('.bar-fill').forEach(el=>{
        el.style.width = el.dataset.pct+'%';
      });
    }, 80);
  });
}

renderNav();
render();
</script>
</body>
</html>
