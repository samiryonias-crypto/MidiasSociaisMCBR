<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ação Mídias Sociais — Acompanhamento Semanal MC BR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:          #1C1530;
    --surface:     #261E3D;
    --surface2:    #2E2549;
    --border:      rgba(255,255,255,0.07);
    --border-hi:   rgba(255,255,255,0.13);
    --purple:      #7B52AB;
    --purple-dim:  rgba(123,82,171,0.18);
    --gold:        #C9A84C;
    --gold-dim:    rgba(201,168,76,0.15);
    --green:       #3DAA77;
    --green-dim:   rgba(61,170,119,0.15);
    --red:         #D95F52;
    --red-dim:     rgba(217,95,82,0.15);
    --amber:       #D4924A;
    --amber-dim:   rgba(212,146,74,0.15);
    --blue:        #4A8FD4;
    --blue-dim:    rgba(74,143,212,0.15);
    --muted:       rgba(255,255,255,0.22);
    --muted2:      rgba(255,255,255,0.10);
    --text:        #FFFFFF;
    --text-sub:    rgba(255,255,255,0.55);
    --text-dim:    rgba(255,255,255,0.30);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── HEADER ── */
  .header {
    padding: 36px 48px 0;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 24px;
  }
  .header-title {
    font-family: 'DM Sans', sans-serif;
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.2px;
  }
  .header-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 8px;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 500;
    padding: 4px 11px;
    border-radius: 20px;
    letter-spacing: 0.3px;
  }
  .pill-live {
    background: var(--gold-dim);
    border: 1px solid rgba(201,168,76,0.3);
    color: var(--gold);
  }
  .pill-live::before {
    content: '';
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--gold);
    animation: blink 2s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.25} }

  /* linha dourada — assinatura visual */
  .gold-rule {
    height: 1px;
    background: linear-gradient(90deg, var(--gold) 0%, rgba(201,168,76,0.1) 60%, transparent 100%);
    margin: 28px 48px 0;
  }

  /* ── WEEK NAV ── */
  .week-nav {
    display: flex;
    gap: 6px;
    padding: 24px 48px 0;
    flex-wrap: wrap;
  }
  .week-btn {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 500;
    padding: 7px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.18s;
    line-height: 1;
  }
  .week-btn:hover:not(.locked) {
    border-color: var(--border-hi);
    color: var(--text);
  }
  .week-btn.active {
    background: var(--purple-dim);
    border-color: rgba(123,82,171,0.5);
    color: var(--text);
    font-weight: 600;
  }
  .week-btn.locked { opacity: 0.3; cursor: default; }
  .week-range { font-weight: 400; color: var(--text-dim); margin-left: 4px; }

  /* ── MAIN ── */
  .main { padding: 32px 48px 56px; display: flex; flex-direction: column; gap: 28px; }

  /* ── SECTION LABEL ── */
  .sec-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--text-dim);
    margin-bottom: 14px;
  }

  /* ── GRID HELPERS ── */
  .grid-4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; }
  .grid-2 { display: grid; grid-template-columns: repeat(2,1fr); gap: 14px; }

  /* ── CARD ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
  }
  .card-title {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    margin-bottom: 18px;
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .card-title-note {
    font-size: 10px;
    font-weight: 400;
    text-transform: none;
    letter-spacing: 0;
    color: var(--text-dim);
    opacity: 0.7;
  }

  /* ── KPI CARD ── */
  .kpi-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 26px 24px 22px;
    position: relative;
    overflow: hidden;
  }
  .kpi-accent {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    border-radius: 12px 12px 0 0;
  }
  .kpi-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    margin-bottom: 12px;
  }
  .kpi-value {
    font-family: 'DM Sans', sans-serif;
    font-size: 44px;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
    letter-spacing: -2px;
  }
  .kpi-sub {
    font-size: 12px;
    color: var(--text-sub);
    margin-top: 8px;
    font-weight: 400;
  }
  .prog-track {
    height: 3px;
    background: var(--surface2);
    border-radius: 3px;
    margin-top: 12px;
    overflow: hidden;
  }
  .prog-fill {
    height: 100%;
    border-radius: 3px;
    background: var(--gold);
    transition: width 1.1s cubic-bezier(.4,0,.2,1);
  }

  /* ── BAR CHART ── */
  .bar-list { display: flex; flex-direction: column; gap: 11px; }
  .bar-row { display: flex; align-items: center; gap: 10px; }
  .bar-lbl {
    font-size: 12px;
    color: var(--text-sub);
    width: 108px;
    flex-shrink: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .bar-track {
    flex: 1;
    height: 6px;
    background: var(--surface2);
    border-radius: 3px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 1.1s cubic-bezier(.4,0,.2,1);
  }
  .bar-n {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    width: 22px;
    text-align: right;
    flex-shrink: 0;
  }

  /* ── DONUT ── */
  .donut-wrap { display: flex; align-items: center; gap: 20px; }
  .donut-legend { flex: 1; display: flex; flex-direction: column; gap: 9px; }
  .leg-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-sub); }
  .leg-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .leg-n { margin-left: auto; font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 13px; color: var(--text); }

  /* ── STATUS LIST ── */
  .status-list { display: flex; flex-direction: column; gap: 7px; }
  .status-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 14px;
    border-radius: 8px;
    border: 1px solid transparent;
  }
  .status-left { display: flex; flex-direction: column; gap: 2px; }
  .status-lbl { font-size: 12px; font-weight: 500; }
  .status-note { font-size: 10px; opacity: 0.55; font-weight: 400; }
  .status-n { font-family: 'DM Sans', sans-serif; font-size: 20px; font-weight: 700; flex-shrink: 0; }

  .s-green  { background: var(--green-dim);  border-color: rgba(61,170,119,0.2); }
  .s-green  .status-lbl, .s-green  .status-n { color: var(--green); }
  .s-red    { background: var(--red-dim);    border-color: rgba(217,95,82,0.2); }
  .s-red    .status-lbl, .s-red    .status-n { color: var(--red); }
  .s-amber  { background: var(--amber-dim);  border-color: rgba(212,146,74,0.2); }
  .s-amber  .status-lbl, .s-amber  .status-n { color: var(--amber); }
  .s-blue   { background: var(--blue-dim);   border-color: rgba(74,143,212,0.2); }
  .s-blue   .status-lbl, .s-blue   .status-n { color: var(--blue); }
  .s-purple { background: var(--purple-dim); border-color: rgba(123,82,171,0.2); }
  .s-purple .status-lbl, .s-purple .status-n { color: var(--purple); }
  .s-gray   { background: rgba(255,255,255,0.04); border-color: var(--border); }
  .s-gray   .status-lbl, .s-gray   .status-n { color: var(--text-dim); }

  /* ── INSIGHTS ── */
  .insight-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .insight-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px 14px;
    border-radius: 8px;
    background: var(--surface2);
    border-left: 2px solid transparent;
    font-size: 12.5px;
    color: var(--text-sub);
    line-height: 1.55;
  }
  .insight-item.ok     { border-left-color: var(--green); }
  .insight-item.warn   { border-left-color: var(--gold); }
  .insight-item.alert  { border-left-color: var(--red); }
  .insight-item.info   { border-left-color: var(--purple); }
  .insight-icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }

  /* ── EMPTY ── */
  .empty {
    text-align: center;
    padding: 80px 24px;
    color: var(--text-dim);
  }
  .empty-icon { font-size: 32px; margin-bottom: 14px; }
  .empty p { font-size: 14px; line-height: 1.7; }

  /* ── FOOTER ── */
  .footer {
    text-align: center;
    font-size: 11px;
    color: var(--text-dim);
    padding: 0 48px 36px;
  }

  @media (max-width: 960px) {
    .header, .gold-rule, .week-nav, .main, .footer { padding-left: 20px; padding-right: 20px; }
    .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr 1fr; }
    .insight-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 600px) {
    .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header class="header">
  <div>
    <div class="header-title">Ação Mídias Sociais — Acompanhamento Semanal MC BR</div>
    <div class="header-meta">
      <span class="pill pill-live">Em andamento · Jul 2026</span>
    </div>
  </div>
</header>

<div class="gold-rule"></div>
<nav class="week-nav" id="weekNav"></nav>
<main class="main" id="main"></main>
<footer class="footer" id="footer"></footer>

<script>
const WEEKS = [
  { id:'s1', label:'Semana 1', range:'27/06 – 03/07', hasData:true  },
  { id:'s2', label:'Semana 2', range:'04/07 – 10/07', hasData:false },
  { id:'s3', label:'Semana 3', range:'11/07 – 17/07', hasData:false },
  { id:'s4', label:'Semana 4', range:'18/07 – 24/07', hasData:false },
];

const DATA = {
  s1: {
    total: 70,
    reservaSolicitada: 65,
    naoSolicitada: 5,
    contatoSim: 22,
    naoResponderam: 36,
    taxaContato: (22/65*100),

    canais: [
      { nome:'Instagram',   n:64, cor:'#7B52AB' },
      { nome:'LinkedIn',    n:3,  cor:'#C9A84C' },
      { nome:'X (Twitter)', n:2,  cor:'#4A8FD4' },
      { nome:'Facebook',    n:1,  cor:'#3DAA77' },
    ],

    temas: [
      { nome:'Outro',         n:13, cor:'#7B52AB' },
      { nome:'Reprogramação', n:8,  cor:'#C9A84C' },
      { nome:'Reembolso',     n:5,  cor:'#D4924A' },
      { nome:'Cancelamento',  n:5,  cor:'#D95F52' },
      { nome:'Alteração',     n:5,  cor:'#4A8FD4' },
      { nome:'Voucher',       n:2,  cor:'#3DAA77' },
    ],

    provedores: [
      { nome:'Azul',    n:7, cor:'#4A8FD4' },
      { nome:'LAT',     n:5, cor:'#7B52AB' },
      { nome:'G3',      n:4, cor:'#C9A84C' },
      { nome:'Sabre',   n:3, cor:'#D4924A' },
      { nome:'Expedia', n:2, cor:'#3DAA77' },
      { nome:'Desp',    n:2, cor:'#D95F52' },
      { nome:'Amadeus', n:1, cor:'#4A8FD4' },
      { nome:'Delta',   n:1, cor:'#7B52AB' },
      { nome:'N1A',     n:1, cor:'#C9A84C' },
      { nome:'TVP',     n:1, cor:'#D4924A' },
    ],

    contatoRDS: [
      { lbl:'Sim',                    n:22, cls:'s-green' },
      { lbl:'Não',                    n:5,  cls:'s-red'   },
      { lbl:'Reserva não localizada', n:1,  cls:'s-amber' },
      { lbl:'N/A',                    n:42, cls:'s-gray',  note:'sem reserva para verificação' },
    ],

    preRDS: [
      { lbl:'Sim',                             n:19, cls:'s-amber' },
      { lbl:'Não',                             n:8,  cls:'s-blue'  },
      { lbl:'Reserva não localizada em sistema', n:1, cls:'s-red'  },
      { lbl:'N/A',                             n:42, cls:'s-gray',  note:'sem reserva para verificação' },
    ],

    atendidos: [
      { lbl:'Sim',                    n:15, cls:'s-green'  },
      { lbl:'Não, deflectado',        n:2,  cls:'s-amber'  },
      { lbl:'Não, erro SOFIA',        n:1,  cls:'s-red'    },
      { lbl:'Abandonou a chamada',    n:4,  cls:'s-blue',   note:'abandona no início, sem atendimento' },
      { lbl:'Reserva não localizada', n:1,  cls:'s-amber'  },
      { lbl:'N/A',                    n:47, cls:'s-gray',   note:'sem reserva para verificação' },
    ],

    resolucao: [
      { lbl:'Sim',                        n:3,  cls:'s-green'  },
      { lbl:'Parcial',                    n:3,  cls:'s-amber'  },
      { lbl:'Não',                        n:8,  cls:'s-red'    },
      { lbl:'Cliente abandonou — início', n:5,  cls:'s-blue'   },
      { lbl:'Cliente abandonou — durante',n:2,  cls:'s-blue'   },
      { lbl:'Deflectado',                 n:1,  cls:'s-purple' },
      { lbl:'Erro Sofia',                 n:1,  cls:'s-red'    },
      { lbl:'Reserva não localizada',     n:1,  cls:'s-amber'  },
      { lbl:'N/A',                        n:46, cls:'s-gray',   note:'sem reserva para verificação' },
    ],

    pendencias: [
      { lbl:'Sem pendência',   n:15, cls:'s-green'  },
      { lbl:'RS - MAYOR',      n:4,  cls:'s-red'    },
      { lbl:'CANCEL EXO',      n:3,  cls:'s-amber'  },
      { lbl:'CO',              n:2,  cls:'s-purple' },
      { lbl:'CANCEL POR RS',   n:1,  cls:'s-amber'  },
      { lbl:'CF - EXO',        n:1,  cls:'s-blue'   },
      { lbl:'REPRO DORMIDA',   n:1,  cls:'s-blue'   },
      { lbl:'Res. não localizada', n:1, cls:'s-red' },
      { lbl:'N/A',             n:42, cls:'s-gray',   note:'sem reserva para verificação' },
    ],

    insights: [
      { tipo:'ok',   icon:'✅', texto:'22 clientes entraram em contato após a interação via RDS — 31% dos 70 casos.' },
      { tipo:'info', icon:'🔁', texto:'19 eram rechamadores — já haviam tentado contato antes da interação RDS.' },
      { tipo:'info', icon:'📱', texto:'Instagram representa 91% dos casos — canal dominante da ação.' },
      { tipo:'warn', icon:'✈️', texto:'Reprogramação e "Outro" concentram 30% dos temas. Azul é o provedor com mais casos (7).' },
      { tipo:'alert',icon:'⚠️', texto:'4 clientes abandonaram a chamada antes do atendimento; 2 foram deflectados.' },
      { tipo:'alert',icon:'🤖', texto:'1 caso de erro SOFIA identificado na Semana 1.' },
      { tipo:'ok',   icon:'📋', texto:'15 casos sem solicitação pendente. RS-MAYOR (4) e CANCEL EXO (3) lideram as pendências.' },
      { tipo:'warn', icon:'🔍', texto:'1 reserva não localizada em sistema — dado a validar.' },
    ],
  },
};

let cur = 's1';

/* ─ DONUT ─ */
function donut(segs, size=96, sw=14) {
  const r=(size-sw)/2, cx=size/2, cy=size/2, c=2*Math.PI*r;
  const tot=segs.reduce((a,s)=>a+s.n,0);
  let off=0;
  const arcs=segs.map(s=>{
    const d=(s.n/tot)*c;
    const a=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.cor}" stroke-width="${sw}" stroke-dasharray="${d.toFixed(2)} ${(c-d).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"/>`;
    off+=d; return a;
  });
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex-shrink:0">${arcs.join('')}</svg>`;
}

/* ─ BAR ─ */
function bars(items, maxN) {
  return `<div class="bar-list">${items.map(t=>`
    <div class="bar-row">
      <div class="bar-lbl" title="${t.nome}">${t.nome}</div>
      <div class="bar-track"><div class="bar-fill" data-pct="${(t.n/maxN*100).toFixed(1)}" style="width:0%;background:${t.cor}"></div></div>
      <div class="bar-n">${t.n}</div>
    </div>`).join('')}</div>`;
}

/* ─ STATUS CARD ─ */
function statusCard(title, items) {
  return `<div class="card">
    <div class="card-title">${title}</div>
    <div class="status-list">${items.map(r=>`
      <div class="status-row ${r.cls}">
        <div class="status-left">
          <span class="status-lbl">${r.lbl}</span>
          ${r.note?`<span class="status-note">${r.note}</span>`:''}
        </div>
        <span class="status-n">${r.n}</span>
      </div>`).join('')}
    </div>
  </div>`;
}

/* ─ WEEK NAV ─ */
function renderNav() {
  document.getElementById('weekNav').innerHTML = WEEKS.map(w=>`
    <button class="week-btn ${w.id===cur?'active':''} ${!w.hasData?'locked':''}"
      ${w.hasData?`onclick="go('${w.id}')"`:''}>${w.label}
      <span class="week-range">${w.range}</span>
    </button>`).join('');
}

function go(id){ cur=id; renderNav(); render(); }

/* ─ RENDER ─ */
function render() {
  const el = document.getElementById('main');
  const ft = document.getElementById('footer');
  const d  = DATA[cur];
  const wk = WEEKS.find(w=>w.id===cur);

  if (!d) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">📅</div><p>Os dados desta semana ainda serão inseridos.</p></div>`;
    ft.innerHTML = '';
    return;
  }

  const tx = d.taxaContato.toFixed(1);
  const maxT = Math.max(...d.temas.map(t=>t.n));
  const maxP = Math.max(...d.provedores.map(t=>t.n));

  el.innerHTML = `

    <!-- KPIs -->
    <section>
      <div class="sec-label">Visão Geral · ${wk.label} (${wk.range})</div>
      <div class="grid-4">

        <div class="kpi-card">
          <div class="kpi-accent" style="background:var(--purple)"></div>
          <div class="kpi-label">Total de Casos</div>
          <div class="kpi-value">${d.total}</div>
          <div class="kpi-sub">derivados ao WhatsApp</div>
        </div>

        <div class="kpi-card">
          <div class="kpi-accent" style="background:var(--gold)"></div>
          <div class="kpi-label">Reserva Solicitada</div>
          <div class="kpi-value">${d.reservaSolicitada}</div>
          <div class="kpi-sub">${d.naoSolicitada} já compartilharam no relato</div>
        </div>

        <div class="kpi-card">
          <div class="kpi-accent" style="background:var(--green)"></div>
          <div class="kpi-label">Entraram em Contato</div>
          <div class="kpi-value">${d.contatoSim}</div>
          <div class="kpi-sub">após interação RDS</div>
        </div>

        <div class="kpi-card">
          <div class="kpi-accent" style="background:var(--amber)"></div>
          <div class="kpi-label">Taxa de Contato</div>
          <div class="kpi-value">${tx}%</div>
          <div class="prog-track"><div class="prog-fill" id="pf" style="width:0%"></div></div>
          <div class="kpi-sub">${d.naoResponderam} não responderam</div>
        </div>

      </div>
    </section>

    <!-- CANAL / TEMA / PROVEDOR -->
    <section>
      <div class="sec-label">Canal, Tema & Provedor</div>
      <div class="grid-3">

        <div class="card">
          <div class="card-title">Canal de Origem</div>
          <div class="donut-wrap">
            ${donut(d.canais)}
            <div class="donut-legend">
              ${d.canais.map(c=>`
                <div class="leg-row">
                  <div class="leg-dot" style="background:${c.cor}"></div>
                  <span>${c.nome}</span>
                  <span class="leg-n">${c.n}</span>
                </div>`).join('')}
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-title">
            Tema do Contato
            <span class="card-title-note">38 preenchidos de 70</span>
          </div>
          ${bars(d.temas, maxT)}
        </div>

        <div class="card">
          <div class="card-title">
            Provedor
            <span class="card-title-note">27 preenchidos de 70</span>
          </div>
          ${bars(d.provedores, maxP)}
        </div>

      </div>
    </section>

    <!-- JORNADA DE CONTATO -->
    <section>
      <div class="sec-label">Jornada de Contato</div>
      <div class="grid-2">
        ${statusCard('Contato após interação RDS', d.contatoRDS)}
        ${statusCard('Contato pré-RDS — rechamadores', d.preRDS)}
      </div>
    </section>

    <!-- ATENDIMENTO & RESOLUÇÃO -->
    <section>
      <div class="sec-label">Atendimento & Resolução</div>
      <div class="grid-3">
        ${statusCard('Foi atendido?', d.atendidos)}
        ${statusCard('Houve resolução?', d.resolucao)}
        ${statusCard('Solicitação pendente', d.pendencias)}
      </div>
    </section>

    <!-- INSIGHTS -->
    <section>
      <div class="sec-label">Pontos de Atenção & Destaques</div>
      <div class="card">
        <div class="insight-grid">
          ${d.insights.map(i=>`
            <div class="insight-item ${i.tipo}">
              <span class="insight-icon">${i.icon}</span>
              <span>${i.texto}</span>
            </div>`).join('')}
        </div>
      </div>
    </section>
  `;

  ft.innerHTML = `${wk.label} (${wk.range}) · Semana ${cur.slice(1)} de 4 · Melhoria Contínua BR`;

  requestAnimationFrame(()=>{
    setTimeout(()=>{
      const pf = document.getElementById('pf');
      if(pf) pf.style.width = tx+'%';
      document.querySelectorAll('.bar-fill').forEach(el=>{
        el.style.width = el.dataset.pct+'%';
      });
    }, 80);
  });
}

renderNav();
render();
</script>
</body>
</html>
